<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders | EDZ Solutions</title>
  <meta name="description" content="Sign in to see your EDZ Solutions orders and reorder your metal cards.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/edz-icon.png">
  <link rel="apple-touch-icon" href="/img/edz-icon.png">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .signin { max-width: 440px; margin: 0 auto; }
    .signin .step2 { margin-top: 18px; }
    .code-input { font-size: 1.6rem; letter-spacing: .4em; text-align: center; font-weight: 800; }
    .acct-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .orders { display: grid; gap: 18px; }
    .order { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 760px) { .order { grid-template-columns: 1fr; } }
    .order .art { aspect-ratio: 3.375 / 2.125; border-radius: 12px; background: #fff; border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: .9rem; text-align: center; padding: 0; }
    .order .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .order h3 { margin: 0 0 4px; }
    .order .meta { color: var(--muted); font-size: .93rem; }
    .order .status { display: inline-block; margin: 8px 0 14px; padding: 4px 10px; border-radius: 99px; background: var(--bg-soft); font-size: .8rem; font-weight: 700; }
    .reorder { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 10px; align-items: end; }
    @media (max-width: 560px) { .reorder { grid-template-columns: 1fr 1fr; } .reorder .wide { grid-column: 1 / -1; } }
    .reorder label { margin: 0; font-size: .85rem; }
    .reorder .promo { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <section class="page-head" style="padding:48px 0 40px">
    <div class="wrap">
      <div class="eyebrow" style="color:var(--accent)">My orders</div>
      <h1>Your cards, ready to reorder</h1>
      <p class="lead">Sign in with the email you used at checkout. We'll email you a 6-digit code, so there's no password to remember.</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="wrap">
      <div class="card signin" id="signin">
        <form id="email-form">
          <label>Email you ordered with<input type="email" name="email" id="email" required autocomplete="email" placeholder="you@yourbusiness.com"></label>
          <button class="btn btn-primary" type="submit" style="width:100%">Email me a code</button>
        </form>
        <form id="code-form" class="step2" hidden>
          <label>6-digit code<input name="code" id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
          <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
          <p class="hint" style="margin:10px 0 0">No email? Check spam, or <a href="#" id="resend">send a new code</a>.</p>
        </form>
        <div class="msg" id="signin-msg" role="status"></div>
      </div>

      <div id="account" hidden>
        <div class="acct-bar">
          <div>Signed in as <strong id="who"></strong></div>
          <button class="btn btn-outline" id="logout" style="padding:9px 16px">Sign out</button>
        </div>
        <div class="orders" id="orders"></div>
      </div>
    </div>
  </section>

  <script src="/js/site.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
